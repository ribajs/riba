demos:
  other: Sonstige
  intro_html: >-
    Jede Demo aus dem Monorepo wird mit
    <code>yarn workspace @ribajs/doc build:demos</code> gebaut und lässt sich
    hier direkt im Browser ausführen. Der Stand kommt aus dem Manifest dieses
    Builds.
  empty_html: >-
    Keine Demos gefunden. Das Manifest fehlt oder ist leer – bitte zuerst
    <code>yarn workspace @ribajs/doc build:demos</code> ausführen.
  known_issues:
    one: "{{ count }} bekannte Einschränkung"
    other: "{{ count }} bekannte Einschränkungen"

viewer:
  none_selected_html: >-
    Keine Demo ausgewählt – bitte eine aus der
    <a href="demos.html">Demo-Übersicht</a> wählen.
  not_found_before: Keine Demo mit der ID
  not_found_after: gefunden.
  back: Zurück zur Demo-Übersicht
  known_issues: Bekannte Einschränkungen
  width: Demo-Breite
  mobile: "Mobil (375\u00a0px)"
  tablet: "Tablet (768\u00a0px)"
  full: Voll
  reload: Neu laden
  standalone: Standalone öffnen
  source: Quellcode auf GitHub
  category: "Kategorie: {{ category }}"
  status: "Status: {{ status }}"
